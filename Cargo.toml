[workspace]
members = [".", "libcrew", "crewctl"]
# A plain `cargo test`, `cargo clippy` and `cargo build` cover every package, not only the root
# one, so the commit gate and CI keep checking the client and the shared library too.
default-members = [".", "libcrew", "crewctl"]
resolver = "3"

# `deny`, not `forbid`: `forbid` cannot be lifted locally, and one test must set an environment
# variable, which Rust 2024 makes `unsafe` (#50). Every other `unsafe` is a build error.
[workspace.lints.rust]
unsafe_code = "deny"

[package]
name = "crewd"
version = "0.1.0"
edition = "2024"
# `cargo run` means the daemon, as the quickstart in CLAUDE.md and the README assumes, even
# though `default-members` also builds `crewctl`.
default-run = "crewd"

# `use crew::` rather than `use crewd::`: the daemon, the client and the shared library read as
# three parts of one suite (#45).
[lib]
name = "crew"

[dependencies]
libcrew = { path = "libcrew" }
anyhow = "1.0.104"
base64 = "0.23.1"
blake3 = "1.8.7"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29.0"
parking_lot = "0.12.5"
ratatui = "0.30.2"
ring = "0.17.14"
rusqlite = { version = "0.40.2", features = ["bundled"] }
rustls-pki-types = "1.15.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
time = { version = "0.3.55", features = ["parsing"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "sync", "signal", "net", "io-util"] }
toml = "1.1.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ureq = "3.4.2"
nix = { version = "0.30", default-features = false, features = ["fs", "signal"] }

[dev-dependencies]
insta = "1.48.0"
# The TLS listener for the CA-bundle test (#150): a real handshake against a self-signed test CA
# is what proves `RootCerts::Specific` actually replaces the default roots. `default-features =
# false` plus `ring` keeps `aws-lc-rs` — a C toolchain dependency — out of the tree; `std` is
# needed for `ServerConfig`. Already in the dependency tree under `ureq`'s own TLS, at the same
# version (`Cargo.lock` pins both to 0.23.45), so this adds no new crate, only a dev-only feature
# surface on one already there.
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std"] }

[lints]
workspace = true
