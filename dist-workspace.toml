# The release (#248): `dist generate` wrote `.github/workflows/v-release.yml` from this file. Two
# fixes dist has no setting for are hand edits in that workflow, marked `Hand-edited (#272)`, so
# `allow-dirty` stops dist refusing it; a regeneration drops them and `release.rs` in `tests/`
# fails until they are put back.

[workspace]
members = ["cargo:."]

[dist]
cargo-dist-version = "0.33.0"
allow-dirty = ["ci"]
ci = "github"
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu"]
installers = ["shell", "homebrew"]
# One formula per binary package: `brew install stgerman/tap/crewd stgerman/tap/crewctl`.
tap = "StGerman/homebrew-tap"
# dist has no crates.io publisher; `publish-crates.yml` runs `cargo publish --workspace`.
publish-jobs = ["homebrew", "./publish-crates"]
# A pull request plans the release and nothing else: building, hosting and publishing wait for a
# version tag. `release.rs` in `tests/` fails if this or the workflow stops saying so.
pr-run-mode = "plan"
install-path = "CARGO_HOME"
install-updater = false
# Only `v<semver>` tags trigger a release; a tag without the `v` is not a release.
tag-namespace = "v"
# dist writes the install instructions as the release body; this job adds GitHub's notes, built
# from the merged pull requests' titles, so there is no CHANGELOG.md to keep.
post-announce-jobs = ["./release-notes"]
# A job-level `permissions` block drops every scope it does not name, and a called workflow
# cannot raise them again, so without `contents = "read"` the publish job's checkout is refused.
github-custom-job-permissions = { "publish-crates" = { contents = "read" } }
