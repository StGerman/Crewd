# Points at this repo's own real GitHub Issues backlog, as the crew-bot GitHub App
# (`tracker.github_app` below). Comment that key out to fall back to GITHUB_TOKEN in the
# environment — never put a token in this file, it is checked in.
#
# The backlog has not adopted the `state:<name>` label convention yet (see
# src/tracker/github.rs's module doc), so every open, `agent`-labelled issue reports as
# state "open" — active_states reflects that rather than inventing labels that do not exist.
# Once issues start carrying `state:*` labels, active_states/terminal_states should switch to
# that vocabulary instead.

[tracker]
kind = "github"
owner = "StGerman"
repo = "crewd"
active_states = ["open"]
terminal_states = ["closed"]
# The `agent` label is the dispatch marker (#64): carrying it is what makes an issue ready, and
# an assignee is neither needed nor sufficient — a teammate taking a ticket does not hand it to
# an agent. The poll filters on it too, so its cost follows the labelled issues, not the backlog.
dispatch_label = "agent"
# Every write — comments, `state:*` labels, pull requests, pushes — authored by the Crew GitHub
# App (crew-bot[bot]) rather than by whoever's GITHUB_TOKEN this is. The file holds app_id,
# installation_id and private_key_path (`crewd init` writes it); with the key set and the file
# absent or incomplete, the daemon refuses to start, naming what is missing (#98).
github_app = "~/.crewd/github-app.toml"

# A poll costs one `by_states` request plus one `by_ids` per running issue, so the hourly cost
# is (1 + max_concurrent) * 120 at this interval. That scales with the worker count, which is
# the reason this comment sits next to it rather than next to the budget it spends — see the
# rate-limit budget math in src/tracker/github.rs's module doc before tightening either.
[polling]
interval_ms = 30000

[workspace]
root = ".crew/workspaces"
repo = "."

# Live dispatch: real `claude -p` processes, with `--permission-mode bypassPermissions`, against
# real git worktrees. Flipping this is the separate, deliberate decision `WorkerConfig`'s doc
# describes — a real tracker on its own only watches; this is what turns watching into working.
[worker]
kind = "claude"
# Pinned so dogfood runs are reproducible and every run row names what did the work (#36).
model = "claude-opus-5-5"
effort = "medium"

[agent]
# Each concurrent agent brings its own rust-analyzer index and its own `cargo check` — budget
# 1-2 GB resident apiece, because .mcp.json is committed and so every worktree indexes its own
# copy of the tree. Time is not the limit here: the wall clock of a dispatch belongs to the
# agent, so extra workers are close to free in elapsed time and expensive only in memory. On a
# machine that cannot hold that many indexes the symptom is swap and a stalled `cargo check`,
# not an orchestrator error, so lower this before blaming stall_timeout_ms.
#
# Memory is not what binds here today, though. Five concurrent agents drove the account's
# five-hour token window to 1.05 utilization in minutes. Since #37 a rejection pauses dispatch
# until `resetsAt` instead of quarantining each interrupted issue, so hitting the window no
# longer costs quarantines, but this number is still a burn-rate dial: raising it does not buy
# throughput once the window is the limit, it only reaches the pause sooner. One also means
# issues run strictly in the order dispatch picks them, with no two branches built off the
# same base at once.
max_concurrent = 1
# Budgets sized for a real agent rather than for the fake worker. A turn is one `assistant`
# event, so a slice of work runs to dozens of them; at 20 the session was cut every 20 tool
# calls, and at 40 cumulative the issue quarantined before the work could land.
max_turns_per_session = 40
# Raised from 200 after #27 hit that ceiling with its implementation landed and only its TUI
# and test wiring left. The ceiling did its job — it stopped a run that had spent 40 turns on a
# design later rewritten — but a budget that strands finished work one step from the end costs
# more to clear by hand than it saves. This is still a bound, and it is still one of the
# independent brakes on a runaway; the other two are untouched.
max_turns_per_issue = 400
max_retry_backoff_ms = 60000
# 15s was a fake-worker number. Progress only advances on `assistant` events, so one long tool
# call — a cold `cargo check`, a rust-analyzer index — is indistinguishable from a stalled
# agent; at 15s the scheduler kills a working agent mid-build and quarantines it after three.
stall_timeout_ms = 300000
quarantine_after_identical = 3
refresh_miss_grace = 2
# Parked issues — finished, but not yet closed on GitHub — are re-read once per interval so a
# worktree can be reclaimed when its issue closes. Each sweep is one request per parked issue,
# so at 5 minutes this adds 12 * (parked issues) requests per hour on top of the poll budget
# above; parked issues stop being swept once their worktree is reclaimed.
parked_sweep_interval_ms = 300000

# Host-side tracker tools. These writes are real: comments land on the issue, and `set_state`
# rewrites its `state:*` label and open/closed flag. The credential stays in this process — the
# agent gets a per-run token scoped to the one issue it was dispatched for, and never a token
# for GitHub itself.
#
# `set_state` costs three requests (read labels, replace labels, set the flag) against the
# rate-limit budget in src/tracker/github.rs's module doc, so it is worth keeping the per-run
# cap tight enough that a confused agent cannot spend the poll budget on label churn.
[broker]
enabled = true
max_calls_per_run = 10
max_calls_per_issue = 40

# Inspect a headless run without attaching a terminal. `status` reads `bind` out of this file,
# so neither command needs the port repeated to it:
#   crewctl --config crew.github.toml status
#   crewctl --config crew.github.toml status 24
[api]
enabled = true
bind = "127.0.0.1:8787"
# On, for the session supervising this daemon. crewd never hands these tools to a worker (their
# own listener, never passed to the broker), but a dispatched worker still inherits the
# operator's MCP config — local scope included, since its worktree is this same project to
# Claude Code — so on this machine workers can reach them. Accepted: see src/api/mcp.rs.
mcp_enabled = true
mcp_bind = "127.0.0.1:8788"
# Per-run transcripts (src/transcript.rs). Worth more here than against the demo tracker: this
# is the config that dispatches real agents, and the run you need to explain afterwards is the
# one whose scrollback is already gone. `stall_timeout_ms` above means a wedged run can sit in
# `keep_runs` for a long time — retention never deletes a live run's own file, so a low bound
# costs finished runs, not the one being diagnosed.
[transcripts]
enabled = true
max_bytes_per_run = 8388608
keep_runs = 50

# The handoff gate (src/gate/). Before a `Done` is believed, the run's branch is rebased onto
# `base` — fetched from `delivery.remote` first, never the local copy — and these commands run in its worktree, in order, exec'd directly — each entry is an
# argv, not a shell line. A conflict parks the issue blocked, naming the paths; a failing
# command sends its output back to the agent as a continuation; `max_failures` consecutive
# failures park it blocked instead, so the gate cannot become a runaway of its own. The three
# commands are the commit gate in CLAUDE.md — the same bar CI holds, applied before the branch
# leaves the agent rather than after.
[gate]
enabled = true
base = "master"
commands = [
  ["cargo", "fmt", "--check"],
  ["cargo", "clippy", "--all-targets", "--", "-D", "warnings"],
  ["cargo", "test"],
]
max_failures = 3
# A rebase conflict confined to these paths goes back to the agent as a continuation instead of
# parking for a human (#111): they are lists two branches in flight both append to. It counts
# toward `max_failures`. `schema.rs` is here because the gate's own `cargo test` runs
# `a_released_migration_is_never_edited`, which catches a wrong renumbering.
agent_resolvable = ["CLAUDE.md", "docs/**", "src/store/schema.rs"]
# A cold `cargo test` in a fresh worktree builds everything first; 30 minutes is a bound
# against a hang, not a budget a healthy run approaches.
timeout_ms = 1800000
# Delivery (src/sched/delivery.rs). With this on, a run that reports done has its branch pushed
# to `remote` and a pull request opened against `base`, derived from the run record rather than
# composed by the agent. A red CI or an outstanding review comment sends the issue back to an
# agent with the failure in its prompt — the same path a `Continue` takes — and the pull request
# is left open, ready to merge, for a human. Nothing here merges.
#
# Every hand-back is a round. `max_rounds_per_pr` bounds the current pull request and
# `max_rounds_per_issue` bounds the issue's whole life; the second never resets, not for a new
# run and not for a new pull request, because a bound that reset would bound nothing — the same
# reason `max_calls_per_run` alone bounds no broker. At either bound the pull request goes to
# the operator with the outstanding items named.
#
# `reviewers` is empty on purpose. This repository has automatic Copilot review on, and its
# comments are read and worked whether or not anyone requested them. Requesting Copilot over
# REST is the case GETT-174120 describes — the provider says yes and attaches nobody — and the
# verification that follows every request would then hand off every pull request at once, before
# the automatic review has had its minute to post. Name a human login here to have a review
# requested and verified; leave it empty to rely on what the repository already does.
[delivery]
enabled = true
base = "master"
remote = "origin"
reviewers = []
# Whose `COMMENTED` review summaries are read for findings as well as their inline comments; a
# `CHANGES_REQUESTED` summary is read whoever wrote it. The default, spelled out (#126).
summary_reviewers = ["copilot-pull-request-reviewer[bot]"]
max_rounds_per_pr = 3
max_rounds_per_issue = 6
# Two or three requests per open pull request per poll, on top of the tracker budget above.
poll_interval_ms = 120000
# A head CI never reports on is handed off after this long rather than waited on forever.
ci_timeout_ms = 3600000
