# The commit gate, run by a machine instead of by whoever remembers.
#
# `cargo fmt --check`, `cargo clippy --all-targets -- -D warnings` and `cargo test` are the
# standing bar in CLAUDE.md, and until this file existed nothing enforced them. It runs on pull
# requests only: every dispatched agent's branch reaches review through one, because delivery
# opens it, so a pull request is where a red gate can still stop a merge. A push with no pull
# request behind it is checked locally or not at all.
#
# Each gate is its own job, so a pull request shows a check per gate, each passing or failing separately
# and run in parallel. None waits on another: ordering them would only delay the answer, since
# each one fails for reasons the others cannot see.
#
# The suite is unusually well suited to a runner and that is not an accident. Time only moves
# when a test moves it (`FakeClock`), every external seam has a fake, and there are no sleeps
# anywhere -- the properties that make `tests/scheduler.rs` worth having are the same ones
# that make it non-flaky here, and fast.
#
# ---------------------------------------------------------------------------------------
# DO NOT MAKE THIS JOB RUN AN EXAMPLE.
#
# `examples/broker_live.rs` drives a real `claude` binary against a real broker: it spawns a
# tool-using agent process and spends tokens. The only thing standing between this runner and
# that is a Cargo default -- example targets are `test = false`, so every cargo *test* verb
# (`cargo test`, `--all-targets`, even `--examples`) compiles them and never calls `main`.
# Compiling them is the point; running one is the accident. `cargo run --example` is what
# crosses the line, so it must never appear in this file.
#
# That property is load-bearing and invisible, which is why it is written here rather than
# left to be rediscovered.
# ---------------------------------------------------------------------------------------

name: CI

on:
  pull_request:

# One run per pull request: a new push supersedes the run for the previous head.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# No setup-toolchain action in any job, on purpose: `rust-toolchain.toml` is the single pin and
# rustup honours it on the first cargo invocation. Two places to state a version is one place
# for them to drift apart. Each job's first step forces that install before the cache step,
# which keys on `rustc -vV`, and leaves the resolved version in the log so "which toolchain
# ran" is answerable from the run alone. `cargo --version` goes first and is doing real work:
# it is the rustup proxy, and invoking it is what installs the pinned toolchain. `rustup show`
# is not a substitute -- since rustup 1.28 it reports without installing.
#
# The suite finishes in seconds; a job near its timeout is hung, not slow.

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Resolve pinned toolchain
        run: |
          cargo --version
          rustup show active-toolchain
          cargo fmt --version
      - name: cargo fmt --check
        run: cargo fmt --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Resolve pinned toolchain
        run: |
          cargo --version
          rustup show active-toolchain
          cargo clippy --version
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # `--locked` so a drifted Cargo.lock fails the job instead of being quietly updated.
      - name: cargo clippy --all-targets -- -D warnings
        run: cargo clippy --locked --all-targets -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Resolve pinned toolchain
        run: |
          cargo --version
          rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: cargo test
        run: cargo test --locked
      # The client must not be able to open the daemon's store, and its dependency graph is what
      # proves it (#45): a `crewctl` that links SQLite is one careless refactor from opening it.
      # `-e normal` because the integration tests may use the daemon as a dev-dependency.
      - name: crewctl links no daemon-side crate
        run: |
          if cargo tree --locked -p crewctl -e normal --prefix none | grep -E '^(rusqlite|ratatui|tokio|ureq) '; then
            echo "crewctl must not depend on the crates above"; exit 1
          fi

  # What `cargo publish --workspace` will do on a version tag, short of uploading (#248): a
  # missing `description` or an unversioned path dependency fails here rather than after the
  # GitHub release is already out. Verifying builds each package from its packaged sources only;
  # no example runs.
  package:
    name: package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Resolve pinned toolchain
        run: |
          cargo --version
          rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: cargo package --workspace
        run: cargo package --workspace --locked
